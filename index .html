<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>测测你的本命定居城市</title>
    <style>
        /* 莫兰迪色系与小红书风格 */
        :root {
            --bg-color: #F7F7F7;
            --card-bg: #FFFFFF;
            --primary: #949B8C; /* 莫兰迪绿 */
            --accent: #D4A5A5; /* 莫兰迪粉 */
            --text-main: #333333;
            --text-sub: #666666;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 450px; /* 手机宽度 */
            background: var(--card-bg);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        h1 { font-size: 24px; text-align: center; margin-bottom: 10px; color: var(--text-main); }
        h2 { font-size: 18px; margin-bottom: 20px; font-weight: normal; }
        p { line-height: 1.6; color: var(--text-sub); font-size: 15px; }
        
        .btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 15px;
            width: 100%;
            border-radius: 50px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 20px;
            transition: 0.3s;
        }
        .btn:hover { opacity: 0.9; }
        
        .option-btn {
            background-color: #F2F2F2;
            color: var(--text-main);
            text-align: left;
            padding: 15px 20px;
            margin-bottom: 12px;
            border-radius: 12px;
            border: 2px solid transparent;
            width: 100%;
            cursor: pointer;
            font-size: 15px;
        }
        .option-btn.selected {
            border-color: var(--primary);
            background-color: #E8ECE6;
        }

        .hidden { display: none; }
        .progress { height: 6px; background: #EEE; border-radius: 3px; margin-bottom: 20px; }
        .progress-bar { height: 100%; background: var(--accent); border-radius: 3px; width: 0%; transition: 0.3s; }
        
        .result-card {
            border: 1px dashed var(--primary);
            padding: 20px;
            border-radius: 15px;
            background: #FAFAFA;
            margin-top: 20px;
        }
        .tag {
            display: inline-block;
            background: var(--accent);
            color: white;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            margin-right: 5px;
        }
    </style>
</head>
<body>

<div class="container" id="app">
    <!-- 封面 -->
    <div id="cover">
        <h1>测测你的本命定居城市</h1>
        <p style="text-align: center; margin-bottom: 30px;">✨ 你最适合在哪长期定居？<br>告别迷茫，找到属于你的归属感</p>
        <button class="btn" onclick="startTest()">开始测试</button>
    </div>

    <!-- 答题页 -->
    <div id="quiz" class="hidden">
        <div class="progress"><div class="progress-bar" id="progressBar"></div></div>
        <h2 id="questionText">题目加载中...</h2>
        <div id="optionsArea"></div>
    </div>

    <!-- 结果页 -->
    <div id="result" class="hidden">
        <h1>你的本命城市是</h1>
        <h2 style="text-align: center; color: var(--primary); font-weight: bold; font-size: 28px;" id="cityName">城市名</h2>
        
        <div class="result-card">
            <p id="cityDesc">文案加载中...</p>
            <div style="margin-top:15px;">
                <span class="tag" id="tag1">宜居</span>
                <span class="tag" id="tag2">美食</span>
            </div>
        </div>
        
        <p style="text-align: center; font-size: 12px; margin-top: 20px;">截图保存，去小红书寻找同频伙伴吧！</p>
        <button class="btn" onclick="location.reload()">重新测试</button>
    </div>
</div>

<script>
    // 简易数据结构，实际使用需填入完整50个城市
    const questions = [
        { q: "1. 关于气候，你更倾向于？", options: ["四季分明", "四季如春", "热带风情", "干燥清爽"] },
        { q: "2. 周末早晨，你理想的打开方式是？", options: ["早茶/面点", "公园徒步", "看展/探店", "宅家独处"] },
        { q: "3. 对于通勤，你的忍耐极限是？", options: ["30分钟内", "1小时以内", "空气好就行", "无所谓"] },
        // ...此处省略其余1
